services:
  postgres:
    image: postgres:17
    container_name: aihopper-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aihopper
    volumes:
      - aihopper_pg_data:/var/lib/postgresql/data

volumes:
  aihopper_pg_data:
